name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests, coverage, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies
        working-directory: app
        run: npm ci

      - name: Audit known dependency vulnerabilities
        working-directory: app
        run: npm audit --audit-level=low

      - name: Validate overridden dependency compatibility
        working-directory: app
        run: npm ls brace-expansion minimatch

      - name: Run frontend coverage gate
        working-directory: app
        run: npm run test:coverage

      - name: Typecheck and production build
        working-directory: app
        run: npm run build

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: app/coverage/
          if-no-files-found: warn
          retention-days: 14

  engine:
    name: Engine tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Run tests with branch coverage
        if: matrix.python == '3.11'
        run: >-
          ./scripts/run-engine-tests.sh
          --junitxml=test-results/engine-${{ matrix.python }}.xml
          --cov=agentsec_engine
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=52

      - name: Run compatibility tests
        if: matrix.python != '3.11'
        run: >-
          ./scripts/run-engine-tests.sh
          --junitxml=test-results/engine-${{ matrix.python }}.xml

      - name: Upload engine test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results-python-${{ matrix.python }}
          path: |
            engine/test-results/
            engine/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  frozen-engine:
    name: Frozen engine smoke (${{ matrix.os }})
    needs: [frontend, engine]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: Install engine and PyInstaller
        run: python -m pip install -e "./engine" pyinstaller

      - name: Freeze engine
        run: node scripts/build-engine.cjs

      - name: Exercise frozen IPC and ATR worker
        run: python scripts/smoke-frozen-engine.py
